name: Android release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=SCENORA_API_URL=${{ vars.SCENORA_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: scenora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/app-release.apk --generate-notes --title "SCENORA ${GITHUB_REF_NAME}"
